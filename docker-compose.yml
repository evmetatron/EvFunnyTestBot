version: '3.7'
services:
  evfunnytest_db:
    image: 'postgres:14'
    ports:
      - '${EV_POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${EV_POSTGRES_DB}
      POSTGRES_USER: ${EV_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${EV_POSTGRES_PASSWORD}
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
  evfunnytest_redis:
    image: redis
    ports:
      - '${EV_REDIS_PORT:-6379}:6379'
volumes:
  postgres_data: null
