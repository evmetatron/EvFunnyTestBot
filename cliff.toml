[changelog]
header = """
# Changelog

Все заметные изменения в проекте документируются в этом файле.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% set group_order = [
    "🚀 Features", "🐛 Bug Fixes", "⚡ Performance", "♻️ Refactor",
    "📝 Documentation", "🧪 Tests", "👷 CI", "⬆️ Dependencies",
    "🧹 Chores", "🔧 Other",
] %}\
{% for group_name in group_order %}\
    {% set_global group_commits = commits | filter(attribute="group", value=group_name) %}\
    {% if group_commits | length > 0 %}
### {{ group_name }}
{% for commit in group_commits %}
- {{ commit.message | upper_first | trim }}\
{% endfor %}
    {% endif %}\
{% endfor %}\n
"""
footer = ""
trim = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"

commit_preprocessors = [
  # берём только заголовок коммита — тело (у Dependabot туда попадает весь PR-текст) в changelog не нужно
  { pattern = '(?s)\n.*', replace = "" },
  # ссылка на PR из "... (#123)", которую github-сквош-мёрж дописывает в конец заголовка
  { pattern = '\(#(\d+)\)$', replace = "([#${1}](https://github.com/evmetatron/EvFunnyTestBot/pull/${1}))" },
]

commit_parsers = [
  { message = "^feat", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "♻️ Refactor" },
  { message = "^docs?", group = "📝 Documentation" },
  { message = "^test", group = "🧪 Tests" },
  { message = "^ci", group = "👷 CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^[Bb]ump ", group = "⬆️ Dependencies" },
  { message = "^chore", group = "🧹 Chores" },
  { message = ".*", group = "🔧 Other" },
]

[bump]
# У бота уже была рабочая история до заведения тегов — стартуем не с 0.1.0, а с 1.0.0.
initial_tag = "v1.0.0"
