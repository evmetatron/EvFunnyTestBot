name: Build and deploy

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

  workflow_dispatch:

jobs:
  analyse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Run detekt
        run: ./gradlew detekt

      - name: Run tests
        run: ./gradlew test --stacktrace

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: analyse
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/evmetatron/evfunnytestbot
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Публикуем только на реальный push в master / тег v* — не на
          # workflow_dispatch с произвольной ветки и не на pull_request.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-image
    # Деплоим только на настоящий push тега vX.Y.Z (см. release.yml) — не на
    # workflow_dispatch с выбранным тегом в ref: build-image в этом случае образ
    # не публикует (push там тоже гейтится github.event_name == 'push'), так что
    # деплоить было бы нечего.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    environment:
      name: production

    steps:
      - uses: actions/checkout@v7

      - name: Check KUBE_CONFIG is configured
        id: gate
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KUBE_CONFIG secret is not set — skipping deploy. Configure it once the cluster is ready (see deploy/README.md)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up kubectl
        if: steps.gate.outputs.configured == 'true'
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        if: steps.gate.outputs.configured == 'true'
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Point the deployment at this release's image
        if: steps.gate.outputs.configured == 'true'
        env:
          # через env, а не ${{ }} прямо в скрипт — иначе имя тега подставляется
          # в текст команды и допускает shell-инъекцию (напр. тег "v1$(...)")
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          FILE=deploy/k8s/kustomization.yaml
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected release tag '$RELEASE_TAG' — expected vX.Y.Z"
            exit 1
          fi
          if ! grep -q "newTag: latest" "$FILE"; then
            echo "::error::Expected 'newTag: latest' in $FILE — did its images: block change shape?"
            exit 1
          fi
          sed -i "s|newTag: latest|newTag: ${RELEASE_TAG}|" "$FILE"
          grep "newTag:" "$FILE"

      - name: Apply manifests
        if: steps.gate.outputs.configured == 'true'
        run: kubectl apply -k deploy/k8s

      - name: Wait for rollout
        if: steps.gate.outputs.configured == 'true'
        run: kubectl -n evfunnytest rollout status deployment/bot --timeout=180s
