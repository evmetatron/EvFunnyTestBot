version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Мажорные версии обновляем вручную отдельными PR — они почти всегда
    # тянут ломающие изменения (Spring Boot, Kotlin, Gradle, testcontainers,
    # kotest, telegrambots). Dependabot ведёт только minor/patch.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "io.spring.dependency-management"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      test:
        patterns:
          - "io.kotest*"
          - "io.mockk*"
          - "org.testcontainers*"
          - "org.junit*"
