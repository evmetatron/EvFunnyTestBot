apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: evfunnytest

resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - bot.yaml

# secret.example.yaml намеренно не в resources — реальный секрет создаётся на кластере.

# Тег образа переопределяет деплой-джоба:
#   kustomize edit set image ghcr.io/evmetatron/evfunnytestbot=ghcr.io/evmetatron/evfunnytestbot:sha-XXXXXXX
images:
  - name: ghcr.io/evmetatron/evfunnytestbot
    newTag: latest
