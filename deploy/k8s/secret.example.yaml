# Шаблон. НЕ применяется kustomize и не содержит реальных значений.
# Создать настоящий секрет один раз на кластере:
#
#   kubectl create namespace evfunnytest
#   kubectl -n evfunnytest create secret generic evfunnytest-secrets \
#     --from-literal=EV_BOT_NAME=... \
#     --from-literal=EV_BOT_TOKEN=... \
#     --from-literal=EV_POSTGRES_DB=evfunnytest \
#     --from-literal=EV_POSTGRES_USERNAME=evfunnytest \
#     --from-literal=EV_POSTGRES_PASSWORD=...
#
# Либо завести SealedSecret / External Secrets и хранить зашифрованным в репозитории.
apiVersion: v1
kind: Secret
metadata:
  name: evfunnytest-secrets
  namespace: evfunnytest
type: Opaque
stringData:
  EV_BOT_NAME: "REPLACE_ME"
  EV_BOT_TOKEN: "REPLACE_ME"
  EV_POSTGRES_DB: "evfunnytest"
  EV_POSTGRES_USERNAME: "evfunnytest"
  EV_POSTGRES_PASSWORD: "REPLACE_ME"
